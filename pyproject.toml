[project]
name = "mindvirus-swarm"
version = "0.1.0"
description = "Reproducible non-coding agent-swarm contagion experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Mind Virus Replication Study" }]
dependencies = [
  "httpx>=0.28.1",
  "matplotlib>=3.10.0",
  "networkx>=3.4.2",
  "numpy>=2.2.0",
  "pandas>=2.2.3",
  "pydantic>=2.10.0",
  "PyYAML>=6.0.2",
  "rich>=13.9.4",
  "scipy>=1.15.0",
  "statsmodels>=0.14.4",
  "tabulate>=0.9.0",
  "typer>=0.15.1",
]

[project.optional-dependencies]
providers = ["litellm>=1.60.0"]
tinker = [
  "tinker==0.26.1",
  "tinker-cookbook==0.5.5",
]
dev = [
  "mypy>=1.14.1",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.4",
]

[project.scripts]
mindvirus = "mindvirus.cli:app"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindvirus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mindvirus"]

[[tool.mypy.overrides]]
module = [
  "matplotlib.*",
  "networkx.*",
  "pandas.*",
  "scipy.*",
  "statsmodels.*",
  "yaml.*",
]
ignore_missing_imports = true
